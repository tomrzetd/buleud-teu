name: Uji engine & Apps Script
on:
  push:
    paths: ['web/js/**', 'apps-script/**', 'tools/**', 'spec/**', '.github/workflows/tests.yml']
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy scipy opencv-python-headless pillow
      - run: npm i --no-save playwright@1 terser@5.44.1 && npx playwright install --with-deps chromium
      - name: Build Apps Script distribusi padat (tanpa ubah nama handler/global)
        run: node tools/minify_gas.js
      - name: Uji end-to-end source distribusi yang SUDAH diminify
        env:
          BT_GAS_BUNDLE: apps-script/dist/BuleudTeu_deploy_min.gs
        run: |
          node tools/test/test_appscript.js
          node tools/test/test_signed_license.js
          node tools/test/test_schema_dapodik.js
          node tools/test/test_roster_license.js
          node tools/test/test_scan_replay.js
          node tools/test/test_security.js
      - name: Uji GitHub Pages (rute subpath, isolasi cache, offline Chromium)
        run: node tools/test/test_pages.js && node tools/test/e2e_pages.js
      - name: Render template & buat foto uji
        run: node tools/render_templates.js 200 && python3 tools/test/gen_cases.py
      - name: Engine mode marker (16 kondisi foto)
        run: node tools/test/run_engine.js
      - name: Regresi formulir bermarker 25 / 50, kunci 20 / 25
        run: node tools/test/test_marker25.js
      - name: LJK percetakan SMPN 2 (marker bergeser, kotak bawah terpotong; 13 kondisi foto)
        run: python3 tools/test/gen_percetakan.py sintetis /tmp/percetakan && node tools/test/test_percetakan.js /tmp/percetakan
      - name: Dashboard TV Pokja (agregat tanpa data pribadi)
        run: node tools/test/test_tv.js
      - name: Pembuat ujian ASAS massal + Dashboard ASAS (sumber)
        run: node tools/test/test_asas.js
      - name: Template F4 tanpa marker 20 & 25 soal (10 kondisi foto)
        run: python3 tools/test/test_lama_template.py 20 && python3 tools/test/test_lama_template.py 25
      - name: Paket onboarding sekolah (lisensi, pemisahan rahasia & kit guru)
        run: python3 tools/test/test_school_pack.py && python3 tools/test/test_release_manifest.py
      - name: Skema Dapodik v2 / migrasi v1 / rombel SD–SMP–SMA
        run: node tools/test/test_schema_dapodik.js
      - name: Lisensi kriptografis, demo, roster guru dan pembatasan server
        run: node tools/test/test_signed_license.js && node tools/test/test_roster_license.js
      - name: Replay ScanID outbox saat respons server hilang
        run: node tools/test/test_scan_replay.js
      - name: Statistik vs numpy/scipy
        run: python3 tools/test/test_stats.py
      - name: Apps Script (tiruan layanan Google)
        run: node tools/test/test_appscript.js
      - name: Uji struktur kelas rombel Dapodik dan lisensi
        run: node tools/test/test_roster_license.js
      - name: Uji keamanan & integritas statistik (temuan audit)
        run: node tools/test/test_security.js
      - name: Lampirkan Apps Script siap deploy (hanya jika tes lulus)
        uses: actions/upload-artifact@v4
        with:
          name: buleud-teu-apps-script-minified
          path: apps-script/dist/BuleudTeu_deploy_min.gs
          if-no-files-found: error
          retention-days: 30
